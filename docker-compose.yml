services:
  app:
    build: .
    container_name: yatra-app
    volumes:
      - .:/var/www

  nginx:
    image: nginx:latest
    container_name: yatra-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app